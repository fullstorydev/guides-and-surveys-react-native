// com.android.library and kotlin-android have no version because they are already on the root
// buildscript classpath (added by the host app). compose plugin is resolved from the plugin
// portal directly — no subproject buildscript{} block needed.
plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// Apply the React Native Gradle plugin only on new arch. This plugin triggers codegen,
// which generates NativeGuidesAndSurveysSpec — needed by src/turbo.
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdk 36
    namespace "com.fullstory.guidesandsurveys"

    defaultConfig {
        minSdk 24
        // Expose arch flag to Kotlin/Java so RNGuidesAndSurveysPackage can set isTurboModule correctly.
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    sourceSets {
        main {
            // Compile the TurboModule variant on new arch, the bridge variant on old arch.
            // Both define the same class name (RNGuidesAndSurveysModule) so the package
            // doesn't need to know which one it's using.
            if (isNewArchitectureEnabled()) {
                kotlin.srcDirs += ['src/turbo/kotlin']
            } else {
                kotlin.srcDirs += ['src/legacy/kotlin']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

// Resolve the react-native version from the consuming app's node_modules
def reactNativeDir = new File("${rootProject.projectDir}/../node_modules/react-native")

dependencies {
    // React Native — resolved from the host app's node_modules
    if (reactNativeDir.exists()) {
        compileOnly fileTree(dir: "${reactNativeDir}/android", include: ['*.jar', '*.aar'])
        compileOnly fileTree(dir: "${reactNativeDir}/Libraries/blob/android/build/outputs/aar", include: ['*.aar'])
    }
    compileOnly "com.facebook.react:react-android"

    // Compose — provided at runtime by the host app (via surveys-sdk)
    compileOnly platform("androidx.compose:compose-bom:2024.06.00")
    compileOnly "androidx.compose.ui:ui"
    compileOnly "androidx.activity:activity-compose:1.9.0"

    // SurveysSDK — must be included via settings.gradle in the host app
    implementation project(':guides-and-surveys')
}
